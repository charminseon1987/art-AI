[project]
name = "art-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # CrewAI Core
    "crewai>=0.80.0",
    "crewai-tools>=0.1.0",
    # LLM & AI
    "openai>=1.12.0",
    "litellm>=1.0.0",
    "langchain-openai>=0.1.0",
    # Web Scraping
    "firecrawl-py>=2.16.3",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    # APIs & Data
    "googlemaps>=4.10.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    # Data Processing
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    # UI
    "streamlit>=1.28.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.15.0",
    # Image Processing
    "pillow>=10.0.0",
    # PDF Generation
    "reportlab>=4.0.0",
    # API Server
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pip>=25.3",
    "aiofiles>=25.1.0",
    # Supabase
    "supabase>=2.0.0",
    "postgrest>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
