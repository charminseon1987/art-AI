# Cloudflare Pages 설정 파일
# Next.js 애플리케이션을 Cloudflare Pages에 배포하기 위한 설정

name = "art-ai-frontend"
compatibility_date = "2024-01-01"

# Pages 프로젝트 설정
# @cloudflare/next-on-pages를 사용할 때는 자동으로 감지되므로 주석 처리
# pages_build_output_dir = ".vercel/output/static"

# 환경 변수는 Cloudflare Pages 대시보드에서 설정하거나
# wrangler pages deploy 시 --env 플래그로 전달할 수 있습니다

# 프로덕션 환경
[env.production]
name = "art-ai-frontend"

# 개발 환경 (선택사항)
# [env.development]
# name = "art-ai-frontend-dev"

# 참고:
# - Cloudflare Pages는 GitHub 연동을 통한 자동 배포를 권장합니다
# - wrangler CLI를 사용한 수동 배포 시에만 이 파일이 필요합니다
# - 대부분의 설정은 Cloudflare Pages 대시보드에서 관리됩니다
