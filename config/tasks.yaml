# AI 그림 분석 도구 태스크 설정
# AI 기반 그림 관찰 시스템의 작업 정의

image_observation_task:
  description: |
    다음 그림에 대한 설명을 바탕으로 AI 이미지 관찰 시스템으로서
    객관적이고 체계적인 관찰을 수행하세요.

    {image_description}

    다음 항목들을 구조화하여 제공하세요:
    1. 주요 색상 (색상명과 대략적인 비율, 색상의 위치)
    2. 주요 형태 (기하학적 형태, 유기적 형태, 추상적 형태 등)
    3. 구성/배치 (중심의 위치, 대칭성, 공간 배치, 균형감 등)
    4. 선의 특성 (선의 두께, 방향, 곡선/직선, 선의 강도 등)
    5. 질감과 세부사항 (표면 질감, 세밀한 부분, 반복 패턴 등)
    6. 전체적인 시각적 인상 (객관적인 시각적 인상만, 해석 없이)

    중요 원칙:
    - 해석이나 진단은 절대 하지 마세요
    - "보이는 것"만을 정확히 기록하세요
    - "의미하는 것"은 기록하지 마세요
    - 객관적이고 구조화된 형식으로 작성하세요

    ⚠️ 본 관찰은 교육 목적의 참고 자료이며, 진단이나 치료를 목적으로 하지 않습니다.
  agent: image_observation_expert
  expected_output: |
    JSON 형식으로 구조화된 관찰 결과:
    {{
        "colors": ["색상1 (위치/비율)", "색상2 (위치/비율)", ...],
        "shapes": ["형태1", "형태2", ...],
        "composition": "구성/배치에 대한 객관적이고 상세한 설명",
        "line_characteristics": ["선의 특성1", "선의 특성2", ...],
        "texture_details": ["질감/세부사항1", "질감/세부사항2", ...],
        "overall_impression": "전체적인 시각적 인상 (객관적 사실만)"
    }}

emotional_language_analysis_task:
  description: |
    AI 감정 표현 관찰 시스템으로서 다음 그림 관찰 결과를 바탕으로
    감정적 표현과 시각적 요소를 분석하세요.

    관찰 결과:
    - 색상: {colors}
    - 형태: {shapes}
    - 구성: {composition}
    - 선의 특성: {line_characteristics}
    - 전체 인상: {overall_impression}

    사용자 선택 감정: {user_emotion}

    다음 항목들을 분석하세요:
    1. 주요 감정 표현 (색상, 형태, 구성, 선에서 나타나는 감정적 표현)
    2. 감정적 톤 (전체적인 감정적 분위기와 기조)
    3. 시각적 특징 요소 (반복되는 패턴, 특별한 기호나 상징, 의미 있는 요소)
    4. 강도 수준 (감정 표현의 강도: 매우 약함/약함/보통/강함/매우 강함)
    5. 색채 특성 관찰 (색상의 일반적 특성, 단 색상 자체의 객관적 관찰)

    중요 원칙:
    - 관찰된 사실을 바탕으로 감정적 표현을 식별하세요
    - 진단이나 치료적 해석은 하지 마세요
    - 색채, 형태에 대한 일반적 지식을 참고하되 객관적으로 기록하세요
    - "이 색상은 슬픔을 의미한다"가 아니라 "이 색상은 일반적으로 슬픔과 연관된다"로 기록하세요

    ⚠️ 본 분석은 교육 목적의 참고 자료이며, 진단이나 치료를 목적으로 하지 않습니다.
  agent: emotional_language_analyst
  expected_output: |
    JSON 형식으로 구조화된 감정 표현 분석 결과:
    {{
        "dominant_emotions": ["감정1", "감정2", ...],
        "emotional_tone": "감정적 톤에 대한 상세한 설명",
        "symbolic_elements": ["시각적 특징 요소1", "시각적 특징 요소2", ...],
        "intensity_level": "매우 약함/약함/보통/강함/매우 강함",
        "color_psychology_notes": "색채 특성 관찰 사항 (객관적)"
    }}

reflection_question_generation_task:
  description: |
    AI 질문 생성 시스템으로서 다음 그림 분석 결과를 바탕으로
    사용자가 자기 탐색에 활용할 수 있는 반성적이고 탐색적인 질문을 생성하세요.

    관찰 결과:
    - 색상: {colors}
    - 형태: {shapes}
    - 구성: {composition}
    - 선의 특성: {line_characteristics}
    - 세부사항: {texture_details}

    감정 표현 분석:
    - 주요 감정: {dominant_emotions}
    - 감정적 톤: {emotional_tone}
    - 시각적 특징 요소: {symbolic_elements}
    - 강도 수준: {intensity_level}

    다음을 고려하여 질문을 생성하세요:
    1. 그림의 구체적인 요소에 대한 질문 (색상, 형태, 구성, 선 등)
    2. 감정적 표현에 대한 질문 (느낌, 감정, 분위기)
    3. 시각적 의미에 대한 질문 (반복 패턴, 특별한 요소)
    4. 그림을 그릴 때의 경험에 대한 질문 (과정, 순간, 감각)
    5. 그림과의 관계에 대한 질문 (그림을 보는 느낌, 그림에 대한 생각)

    질문 생성 원칙:
    - 개방적이고 탐색적인 질문 (예: "이 색상을 선택한 이유는 무엇인가요?")
    - 판단하지 않는 질문 (예: "이 색상이 슬픈 색상인가요?" ❌)
    - 사용자의 경험을 탐색하는 질문
    - "왜"보다는 "어떻게", "무엇"에 초점
    - 사용자가 자신의 언어로 표현할 수 있도록 돕는 질문

    ⚠️ 본 질문은 교육 목적의 자기 탐색 도구이며, 진단이나 치료를 목적으로 하지 않습니다.
  agent: reflection_question_specialist
  expected_output: |
    JSON 형식으로 구조화된 질문 목록:
    {{
        "questions": [
            "질문1 (구체적이고 탐색적)",
            "질문2",
            ...
        ],
        "categories": ["색상/형태", "감정", "시각적 특징", "경험", "관계"],
        "question_purpose": "각 질문의 목적과 사용 시점에 대한 설명",
        "usage_notes": "사용자가 참고할 수 있는 추가 사항"
    }}

report_composition_task:
  description: |
    AI 리포트 작성 시스템으로서 다음 분석 결과들을 종합하여
    사용자가 교육 목적으로 활용할 수 있는 구조화된 분석 리포트를 작성하세요.

    [관찰 결과]
    색상: {colors}
    형태: {shapes}
    구성: {composition}
    선의 특성: {line_characteristics}
    세부사항: {texture_details}
    전체 인상: {overall_impression}

    [감정 표현 분석]
    주요 감정: {dominant_emotions}
    감정적 톤: {emotional_tone}
    시각적 특징 요소: {symbolic_elements}
    강도 수준: {intensity_level}
    색채 특성 관찰: {color_psychology_notes}

    사용자 선택 감정: {user_emotion}

    [탐색 질문]
    {reflection_questions}
    질문 카테고리: {question_categories}
    활용 참고사항: {usage_notes}

    리포트는 다음 구조로 작성하세요:
    1. 요약 (간단한 전체 요약, 핵심 포인트)
    2. 관찰 사항 (구조화된 관찰 결과, 상세하고 명확하게)
    3. 감정적 표현 (감정 표현 분석 결과, 객관적으로)
    4. 탐색 질문 (생성된 질문들, 사용 순서와 목적 포함)
    5. 활용 시 고려사항 (사용자가 주의할 점, 탐색할 영역, 주의사항)
    6. 추가 참고사항 (필요시)

    리포트 작성 원칙:
    - 객관적이고 교육적인 톤 유지
    - 해석이나 진단은 포함하지 않음
    - 사용자가 바로 활용할 수 있는 실용적 형식
    - 구조화되고 읽기 쉬운 형식
    - 자기 이해의 시작점을 제공하는 내용

    ⚠️ 본 리포트는 교육 목적의 참고 자료이며, 의료적 진단이나 치료를 대체하지 않습니다.
  agent: report_composer
  expected_output: |
    구조화된 분석 리포트 (마크다운 형식):

    # 그림 분석 리포트

    ## 요약
    [전체 요약과 핵심 포인트]

    ## 1. 관찰 사항
    [구조화된 관찰 결과]

    ## 2. 감정적 표현
    [감정 표현 분석 결과]

    ## 3. 탐색 질문
    [생성된 질문들과 사용 가이드]

    ## 4. 활용 시 고려사항
    [사용자가 주의할 점과 탐색 영역]

    리포트는 명확하고 구조화되어 있으며, 사용자가 교육 목적으로 바로 활용할 수 있어야 합니다.

professional_conclusion_task:
  description: |
    AI 분석 시스템으로서 다음 분석 결과들을 종합하여
    객관적이고 교육적인 종합 분석을 작성하세요.

    [관찰 결과]
    색상: {colors}
    형태: {shapes}
    구성: {composition}
    선의 특성: {line_characteristics}
    세부사항: {texture_details}
    전체 인상: {overall_impression}

    [감정 표현 분석]
    주요 감정: {dominant_emotions}
    감정적 톤: {emotional_tone}
    시각적 특징 요소: {symbolic_elements}
    강도 수준: {intensity_level}
    색채 특성 관찰: {color_psychology_notes}

    사용자 선택 감정: {user_emotion}

    [탐색 질문]
    {reflection_questions}
    질문 카테고리: {question_categories}

    다음 구조로 종합 분석을 작성하세요:

    1. 요약 및 핵심 인사이트 (Executive Summary)
       - 전체 분석의 핵심 요약 (2-3문단)
       - 가장 중요한 발견 사항 3-5개
       - 객관적이고 명확한 표현

    2. 주요 발견 사항 (Key Findings)
       - 관찰, 감정 분석, 질문에서 도출된 주요 발견 사항
       - 각 발견 사항을 간결하게 나열
       - 객관적 사실 중심

    3. 활용 방향성 제시 (Usage Direction)
       - 이 그림을 바탕으로 한 활용의 주요 방향성
       - 탐색해야 할 주요 영역
       - 사용자가 집중해야 할 포인트

    4. 집중 탐색 영역 (Focus Areas)
       - 활용 시 주목할 구체적 영역
       - 각 영역별 간단한 설명

    5. AI 시스템 종합 분석 (Comprehensive Analysis)
       - AI 시스템 기반의 종합 분석
       - 객관적이고 교육적인 톤
       - 해석이나 진단 없이 관찰 기반 분석 (2-3문단)

    6. 참고 사항 (References)
       - 사용자가 참고할 수 있는 실용적 참고 사항
       - 다음 단계 제안
       - 주의사항이나 고려사항

    중요 원칙:
    - 객관적이고 교육적인 톤 유지
    - 해석이나 진단은 절대 포함하지 않음
    - 관찰된 사실을 바탕으로 한 분석만 제시
    - 사용자가 교육 목적으로 활용할 수 있는 실용적 내용
    - 명확하고 구조화된 형식

    ⚠️ 본 분석은 교육 목적의 참고 자료이며, 의료적 진단이나 치료를 대체하지 않습니다.
  agent: report_composer
  expected_output: |
    JSON 형식으로 구조화된 종합 분석:
    {{
        "executive_summary": "요약 및 핵심 인사이트 (2-3문단, 객관적이고 교육적)",
        "key_findings": [
            "발견 사항1 (간결하고 명확하게)",
            "발견 사항2",
            "발견 사항3",
            ...
        ],
        "usage_direction": "활용 방향성에 대한 상세 설명 (1-2문단)",
        "focus_areas": [
            "탐색 영역1 (간단한 설명 포함)",
            "탐색 영역2",
            ...
        ],
        "comprehensive_analysis": "AI 시스템 종합 분석 (2-3문단, 객관적이고 교육적)",
        "recommendations": [
            "참고 사항1 (실용적이고 실행 가능한)",
            "참고 사항2",
            ...
        ]
    }}
